
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>포스코이앤씨 안전교육 관리자</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f5f8;
      color: #202938;
    }
    .container {
      max-width: 440px;
      margin: 100px auto;
      padding: 20px;
    }
    .card {
      background: white;
      padding: 36px 28px;
      border-radius: 16px;
      box-shadow: 0 5px 24px #00000012;
      text-align: center;
    }
    h1 { font-size: 22px; }
    p { color: #657080; font-size: 14px; }
    input, button {
      width: 100%;
      padding: 15px;
      margin-top: 16px;
      border-radius: 8px;
      font-size: 15px;
    }
    input { border: 1px solid #ccd2db; }
    button {
      background: #005bac;
      color: white;
      border: none;
      cursor: pointer;
    }
    button:disabled { opacity: .6; }
    #message { color: #c0392b; }
    #dashboard { display: none; }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      margin-top: 20px;
    }
    th, td {
      border-bottom: 1px solid #ddd;
      padding: 10px;
      text-align: left;
    }
  </style>
</head>
<body>
  <main class="container">
    <section class="card" id="login">
      <h1>포스코이앤씨</h1>
      <h2>안전교육 관리자</h2>
      <p>관리자 비밀번호를 입력하세요.</p>
      <form id="loginForm">
        <input id="password" type="password"
          placeholder="관리자 비밀번호"
          autocomplete="current-password" required>
        <button id="loginButton" type="submit">
          관리자 로그인
        </button>
      </form>
      <p id="message" role="alert"></p>
    </section>

    <section class="card" id="dashboard">
      <h2>안전교육 수료자 관리</h2>
      <p id="count"></p>
      <button id="exportButton">CSV 다운로드</button>
      <button id="logoutButton">로그아웃</button>
      <div style="overflow-x:auto">
        <table id="records"></table>
      </div>
    </section>
  </main>

  <script>
    const endpoint = "/.netlify/functions/admin";
    let records = [];

    const login = document.getElementById("login");
    const dashboard = document.getElementById("dashboard");
    const message = document.getElementById("message");

    document.getElementById("loginForm")
      .addEventListener("submit", async (event) => {
        event.preventDefault();
        const button = document.getElementById("loginButton");
        button.disabled = true;
        message.textContent = "";

        try {
          const password =
            document.getElementById("password").value;

          const response = await fetch(endpoint, {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            credentials: "same-origin",
            body: JSON.stringify({ password })
          });

          if (!response.ok) {
            throw new Error(
              response.status === 401
                ? "비밀번호가 올바르지 않습니다."
                : "서버 연결을 확인해 주세요."
            );
          }

          const data = await response.json();
          records = data.records || [];
          showDashboard();
        } catch (error) {
          message.textContent = error.message;
        } finally {
          button.disabled = false;
        }
      });

    function showDashboard() {
      login.style.display = "none";
      dashboard.style.display = "block";
      document.getElementById("count").textContent =
        "전체 수료자: " + records.length + "명";

      const table = document.getElementById("records");
      table.replaceChildren();

      if (!records.length) {
        table.textContent = "수료 기록이 없습니다.";
        return;
      }

      const keys = Object.keys(records[0]);
      const header = document.createElement("tr");

      keys.forEach(key => {
        const th = document.createElement("th");
        th.textContent = key;
        header.appendChild(th);
      });
      table.appendChild(header);

      records.forEach(record => {
        const tr = document.createElement("tr");
        keys.forEach(key => {
          const td = document.createElement("td");
          td.textContent = record[key] ?? "";
          tr.appendChild(td);
        });
        table.appendChild(tr);
      });
    }

    document.getElementById("exportButton")
      .addEventListener("click", () => {
        if (!records.length) return;
        const keys = Object.keys(records[0]);
        const escapeCSV = value =>
          '"' + String(value ?? "").replace(/"/g, '""') + '"';
        const rows = [
          keys.map(escapeCSV).join(","),
          ...records.map(record =>
            keys.map(key => escapeCSV(record[key])).join(",")
          )
        ];
        const blob = new Blob(
          ["\uFEFF" + rows.join("\r\n")],
          { type: "text/csv;charset=utf-8" }
        );
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "safety-completions.csv";
        a.click();
        URL.revokeObjectURL(url);
      });

    document.getElementById("logoutButton")
      .addEventListener("click", () => {
        records = [];
        dashboard.style.display = "none";
        login.style.display = "block";
        document.getElementById("password").value = "";
      });
  </script>
</body>
</html>
